<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeRoute</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --orange: #ff7a1a; --orange2: #ff9a3c;
    --ink: #ffffff; --ink2: rgba(255,255,255,.8); --ink3: rgba(255,255,255,.55);
    --line: rgba(255,255,255,.18); --glass: rgba(12,17,30,.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; color: var(--ink);
         background: #0b0f1c; overflow: hidden; }
  a { color: inherit; text-decoration: none; }

  /* ── 한 화면 전체 ───────────────────────────────────── */
  .hero { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }

  /* 배경 사진 + 움직임 레이어. #scene은 JS가 사진 크기·위치(cover)에 맞춰 줌.
     안의 요소들은 사진 원본 좌표(1303 x 1207)의 % 로 자리를 잡음 */
  #scene { position: absolute; left: 0; top: 0; animation: shake 2.6s ease-in-out infinite; }
  /* 차를 작게 보이려고 사진을 줄여서 생긴 빈 가장자리 → 흐린 같은 사진으로 채우고, 경계는 부드럽게 */
  img.backfill { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover;
    filter: blur(28px) brightness(.45) saturate(1.1); }
  #scene, #front {
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent), linear-gradient(180deg, transparent, #000 8%, #000 92%, transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent), linear-gradient(180deg, transparent, #000 8%, #000 92%, transparent);
    mask-composite: intersect; }
  @keyframes shake { 0%,100% { translate: 0 0; } 25% { translate: .6px .5px; } 50% { translate: -.4px -.3px; } 75% { translate: .3px .6px; } }
  #scene img.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #streaks { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 반대편 차는 어두운 덮개 위에 그려서 헤드라이트가 또렷하게 보이게 (글자보다는 아래) */
  #front { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; animation: shake 2.6s ease-in-out infinite; }
  #oncoming { display: block; width: 100%; height: 100%; }

  /* 앞 차만 잘라낸 레이어 → 살짝 출렁이며 달리는 느낌 */
  .car { position: absolute; inset: 0; animation: bob .42s ease-in-out infinite alternate; }
  .car img { position: absolute; inset: 0; width: 100%; height: 100%;
    clip-path: polygon(71.4% 52.7%, 77% 53.3%, 80.6% 53.6%, 85.2% 57.2%, 90.2% 60.3%, 92% 62.1%, 92.5% 66.3%, 92.9% 72.9%,
      91.7% 75%, 90.6% 78.3%, 83.7% 78.8%, 83.3% 75.8%, 62.2% 75.8%, 60.6% 78.3%, 56.8% 78.5%, 55.6% 75.8%,
      53% 73.3%, 49.9% 72.9%, 48.8% 71.2%, 48.7% 65.4%, 49.5% 61.3%, 49.7% 59.8%, 49.7% 58.4%, 51.3% 58.4%,
      53% 58%, 55.3% 55.5%, 58.3% 53.9%, 61.4% 53.4%); }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(.18%); } }

  /* 리어램프 빛 (숨 쉬듯 밝아졌다 어두워짐) */
  .lamp { position: absolute; border-radius: 50%; mix-blend-mode: screen; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255,40,40,.75), rgba(255,30,30,.25) 55%, rgba(255,30,30,0));
    animation: lamp 2.4s ease-in-out infinite; }
  .lamp.l { left: 60%; top: 61.2%; width: 15%; height: 6%; }
  .lamp.r { left: 84.5%; top: 61.2%; width: 9%; height: 6%; }
  @keyframes lamp { 50% { opacity: .55; } }
  /* 젖은 노면의 빨간 반사 (물결처럼 일렁임) */
  .refl { position: absolute; mix-blend-mode: screen; pointer-events: none; transform-origin: top;
    background: linear-gradient(180deg, rgba(255,40,30,.0), rgba(255,40,30,.32) 25%, rgba(255,40,30,0));
    filter: blur(6px); animation: refl 1.1s ease-in-out infinite alternate; }
  .refl.l { left: 61.5%; top: 79%; width: 11%; height: 19%; }
  .refl.r { left: 85.5%; top: 79%; width: 6.5%; height: 15%; animation-delay: -.5s; }
  @keyframes refl { from { transform: scaleY(1) skewX(0); opacity: .9; } to { transform: scaleY(1.12) skewX(-3deg); opacity: .55; } }
  /* 먼 앞차 불빛 */
  .far { position: absolute; left: 33.6%; top: 61.6%; width: 2.4%; height: 1.4%; border-radius: 50%; mix-blend-mode: screen;
    background: radial-gradient(closest-side, rgba(255,50,50,.9), rgba(255,50,50,0)); animation: lamp 1.7s ease-in-out infinite; }

  .shade { position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(6,9,20,.75) 0%, rgba(6,9,20,0) 22%),
      linear-gradient(90deg, rgba(6,9,20,.92) 0%, rgba(6,9,20,.7) 30%, rgba(6,9,20,.15) 52%, rgba(6,9,20,0) 62%); }

  /* ── 상단 메뉴 ─────────────────────────────────────── */
  header { position: relative; z-index: 5; display: flex; align-items: center; gap: 40px;
    height: clamp(64px, 10vh, 92px); padding: 0 4vw; border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo b { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
  .logo b span { color: var(--orange); }
  .logo small { display: block; font-size: 12px; color: var(--ink2); margin-top: 2px; }
  nav { display: flex; gap: clamp(24px, 3.4vw, 56px); margin: 0 auto; font-size: 16px; font-weight: 500; }
  nav a { opacity: .9; } nav a:hover { color: var(--orange2); }
  .btns { display: flex; gap: 14px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; font-weight: 700;
    padding: 12px 26px; font-size: 16px; cursor: pointer; border: 0; transition: transform .15s; font-family: inherit; white-space: nowrap; }
  .btn:hover { transform: translateY(-1px); }
  .btn.ghost { border: 1.5px solid rgba(255,255,255,.6); background: transparent; color: #fff; }
  .btn.fill { background: var(--orange); color: #fff; box-shadow: 0 6px 24px rgba(255,122,26,.4); }

  /* ── 왼쪽 글 (화면 높이에 맞춰 크기가 줄어듦) ────────── */
  .content { position: relative; z-index: 4; padding: 5vh 4vw 0; width: min(max(52vw, 580px), 880px); }
  .kicker { font-size: clamp(15px, 2.3vh, 22px); color: var(--ink2); }
  h1 { font-size: clamp(32px, 7.4vh, 86px); line-height: 1.12; font-weight: 900; letter-spacing: -2px; margin: 1.4vh 0 2.6vh;
       text-shadow: 0 2px 24px rgba(0,0,0,.4); }
  h1 em { font-style: normal; color: var(--orange); }
  .lead { word-break: keep-all; font-size: clamp(14px, min(2vh, 1.7vw), 19px); line-height: 1.6; opacity: .95; text-shadow: 0 1px 10px rgba(0,0,0,.5); }
  .cta { display: flex; gap: 22px; margin-top: 3.4vh; align-items: center; }
  .cta .fill { padding: clamp(12px, 2vh, 20px) clamp(22px, 2.2vw, 34px); font-size: clamp(15px, 2vh, 19px); }
  .play { white-space: nowrap; display: inline-flex; align-items: center; gap: 14px; font-weight: 700; font-size: clamp(15px, 1.9vh, 18px);
    padding: 6px 22px 6px 6px; border: 1px solid var(--line); border-radius: 999px; background: rgba(10,14,26,.25); }
  .play i { width: clamp(40px, 5.6vh, 52px); height: clamp(40px, 5.6vh, 52px); border-radius: 50%; border: 1.5px solid #fff; display: grid; place-items: center; }

  .factors-title { margin-top: 4.4vh; font-size: clamp(16px, 2.3vh, 22px); font-weight: 700; display: flex; align-items: center; gap: 14px; }
  .factors-title::before { content: ""; width: 4px; height: 1em; background: var(--orange); }
  .factors { margin-top: 1.4vh; display: grid; grid-template-columns: repeat(3, 1fr); width: min(720px, 44vw);
    background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(5px); }
  .factor { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: clamp(12px, 2.2vh, 22px) clamp(12px, 1.4vw, 22px); }
  .factor + .factor { border-left: 1px solid var(--line); }
  .factor svg { flex: none; width: clamp(30px, 2.6vw, 44px); height: auto; }
  .factor b { display: block; font-size: clamp(13px, 1.8vh, 17px); margin-bottom: 4px; white-space: nowrap; }
  .factor span { font-size: clamp(12px, 1.6vh, 15px); color: var(--ink2); }

  /* ── 오른쪽 떠 있는 지도 카드 ───────────────────────── */
  .card-wrap { position: absolute; z-index: 3; right: 3vw; top: 12vh; width: min(36vw, 640px); perspective: 1400px; }
  .mapcard { position: relative; aspect-ratio: 1.75; border-radius: 22px;
    transform: rotateY(-14deg) rotateX(10deg) rotateZ(-4deg);
    background: linear-gradient(160deg, rgba(40,52,80,.5), rgba(18,24,40,.55));
    border: 2px solid rgba(255,255,255,.55);
    box-shadow: 0 0 40px rgba(140,180,255,.25), inset 0 0 60px rgba(120,160,255,.08);
    backdrop-filter: blur(4px); overflow: hidden; animation: float 6s ease-in-out infinite; }
  @keyframes float { 50% { translate: 0 -10px; } }
  .mapcard svg.map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .route { stroke-dasharray: 1600; stroke-dashoffset: 1600; animation: draw 2.4s .4s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .pulse { transform-origin: center; transform-box: fill-box; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
  .risk-box { position: absolute; right: 5%; top: 7%; padding: 12px 18px; border-radius: 16px;
    background: rgba(12,16,28,.82); border: 1px solid rgba(255,255,255,.25); display: flex; gap: 12px; align-items: center; }
  .risk-box .lbl { font-size: 13px; font-weight: 700; }
  .risk-box .big { font-size: clamp(24px, 2.4vw, 38px); font-weight: 900; color: var(--orange); line-height: 1.1; font-style: italic; }
  .risk-box .big small { font-size: 16px; font-style: normal; }
  .badge { display: inline-block; margin-top: 4px; background: #e02424; color: #fff; font-weight: 800; font-size: 12px;
    padding: 3px 12px; border-radius: 999px; }
  .risk-box .sub { font-size: 11px; color: var(--ink3); margin-top: 6px; }

  /* ── 좁은 화면 ─────────────────────────────────────── */
  @media (max-width: 900px) {
    .card-wrap { display: none; }
    .content { width: auto; }
    .factors { width: 100%; }
    .shade { background: linear-gradient(180deg, rgba(6,9,20,.85), rgba(6,9,20,.55) 55%, rgba(6,9,20,.1)); }
  }
  @media (max-width: 760px) {
    header { padding: 0 16px; gap: 12px; }
    nav, .btns .ghost { display: none; }
    .btns { margin-left: auto; } .btns .fill { padding: 10px 16px; font-size: 14px; }
    .logo b { font-size: 21px; } .logo svg { width: 36px; }
    .content { padding: 3vh 16px 0; }
    h1 { letter-spacing: -1px; font-size: min(10vw, 6.2vh); }
    .factors-title { margin-top: 3vh; }
    .lead br { display: none; }
    .cta { gap: 10px; flex-wrap: wrap; }
    .play { display: none; }
    .factors-area { position: fixed; left: 16px; right: 16px; bottom: 14px; z-index: 6; }
    .factors-title { margin-top: 0; font-size: 15px; }
    .factors { margin-top: 8px; }
    .shade { background: linear-gradient(180deg, rgba(6,9,20,.9) 0%, rgba(6,9,20,.7) 42%, rgba(6,9,20,0) 54%,
                                          rgba(6,9,20,0) 76%, rgba(6,9,20,.75) 100%); }
    .factor { align-items: center; text-align: center; padding: 10px 6px; }
    .factor b { font-size: 13px; white-space: normal; }
    .factor span { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #scene, .car, .lamp, .refl, .far, .mapcard { animation: none; }
  }
</style>
</head>
<body>

<div class="hero">
  <img class="backfill" src="/static/hero.webp" alt="">
  <div id="scene">
    <img class="bg" src="/static/hero.webp" alt="">
    <canvas id="streaks"></canvas>
    <div class="far"></div>
    <div class="refl l"></div><div class="refl r"></div>
    <div class="car">
      <img src="/static/hero.webp" alt="">
      <div class="lamp l"></div><div class="lamp r"></div>
    </div>
  </div>
  <div class="shade"></div>
  <div id="front"><canvas id="oncoming"></canvas></div>

  <header>
    <a class="logo" href="/">
      <svg width="46" height="52" viewBox="0 0 46 52"><path d="M23 2 L43 9 V25 C43 38 34 46 23 50 C12 46 3 38 3 25 V9 Z" fill="none" stroke="#ff7a1a" stroke-width="4"/>
        <path d="M12 30 L32 16 L24 34 L21 26 Z" fill="#ff7a1a"/></svg>
      <div><b>Safe<span>Route</span></b><small>Predict. Avoid. Drive Safe.</small></div>
    </a>
    <nav>
      <a href="/about">서비스 소개</a>
      <a href="/app">위험 예측</a>
    </nav>
    <div class="btns">
      <a class="btn fill" href="/app">시작하기 →</a>
    </div>
  </header>

  <div class="content">
    <div class="kicker">머신러닝이 예측하는 더 안전한 길</div>
    <h1>미리 본 위험,<br><em>달라지는 운전 습관</em></h1>
    <p class="lead">실시간 교통 데이터와 머신러닝 분석으로 <br>사고 위험을 미리 예측하고, 더 안전한 경로를 안내해 드립니다.</p>
    <div class="cta">
      <a class="btn fill" href="/app">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M2 11 L22 2 L13 22 L11 13 Z"/></svg>
        위험 예측 시작하기 →</a>
      <a class="play" href="/about"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M6 4 L20 12 L6 20 Z"/></svg></i>서비스 소개</a>
    </div>

    <div class="factors-area">
    <div class="factors-title">주요 위험 요인</div>
    <div class="factors">
      <div class="factor">
        <svg viewBox="0 0 54 44" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round">
          <path d="M4 30 L8 20 H24 L28 30 V36 H4 Z"/><circle cx="10" cy="36" r="3.5" fill="#fff"/><circle cx="22" cy="36" r="3.5" fill="#fff"/>
          <path d="M24 34 L30 25 H44 L50 34 V40 H24 Z" fill="#0f1626"/><circle cx="30" cy="40" r="3.5" fill="#fff"/><circle cx="44" cy="40" r="3.5" fill="#fff"/>
          <path d="M34 4 L37 12 L44 8 L40 16 L48 18" stroke="#ff7a1a"/></svg>
        <div><b>사고가 많았던 곳</b><span>최근 3년 사고 기록</span></div>
      </div>
      <div class="factor">
        <svg viewBox="0 0 44 44" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="22" cy="22" r="19"/><path d="M22 10 V22 H31" stroke-linecap="round"/></svg>
        <div><b>사고가 잦은 시간</b><span>오후 5시 ~ 7시</span></div>
      </div>
      <div class="factor">
        <svg viewBox="0 0 54 44" fill="#fff"><circle cx="13" cy="12" r="6"/><circle cx="41" cy="12" r="6"/><circle cx="27" cy="16" r="7"/>
          <path d="M3 40 V28 C3 22 23 22 23 28 V40 Z"/><path d="M31 40 V28 C31 22 51 22 51 28 V40 Z"/><path d="M15 42 V32 C15 25 39 25 39 32 V42 Z" stroke="#0f1626" stroke-width="2"/></svg>
        <div><b>사람·차가 많은 도로</b><span>도심 주요 간선도로</span></div>
      </div>
    </div>
    </div>
  </div>

  <div class="card-wrap">
    <div class="mapcard">
      <svg class="map" viewBox="0 0 700 400">
        <defs>
          <linearGradient id="rg" x1="0" x2="1">
            <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#ff9a3c"/>
            <stop offset=".55" stop-color="#ff2d2d"/><stop offset=".8" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ffb15a"/>
          </linearGradient>
          <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <radialGradient id="hot"><stop offset="0" stop-color="#ff2d2d" stop-opacity=".55"/><stop offset="1" stop-color="#ff2d2d" stop-opacity="0"/></radialGradient>
        </defs>
        <g id="streets" stroke="rgba(200,215,255,.22)" fill="none"></g>
        <circle cx="390" cy="230" r="120" fill="url(#hot)"/>
        <circle class="pulse" cx="390" cy="230" r="60" fill="none" stroke="#ff3b3b" stroke-width="2"/>
        <path class="route" d="M95 170 C130 200 150 225 210 228 S300 245 340 238 S400 226 430 262 S520 300 580 296 S630 260 650 238"
              stroke="url(#rg)" stroke-width="7" fill="none" stroke-linecap="round" filter="url(#glow)"/>
        <circle class="pulse" cx="95" cy="170" r="22" fill="none" stroke="#4d8dff" stroke-width="2"/>
        <path d="M95 148 L110 182 L95 174 L80 182 Z" fill="#3b7bff" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
        <g filter="url(#glow)"><path d="M390 140 L428 206 H352 Z" fill="#e02424" stroke="#ff8080" stroke-width="3" stroke-linejoin="round"/>
          <rect x="386" y="160" width="8" height="26" rx="3" fill="#fff"/><circle cx="390" cy="195" r="4.5" fill="#fff"/></g>
        <g filter="url(#glow)"><path d="M650 238 C632 214 626 204 626 192 A24 24 0 0 1 674 192 C674 204 668 214 650 238 Z" fill="#ff8a2a" stroke="#fff" stroke-width="2"/>
          <circle cx="650" cy="192" r="8" fill="#fff"/></g>
      </svg>
      <div class="risk-box">
        <svg width="36" height="32" viewBox="0 0 44 40"><path d="M22 3 L41 37 H3 Z" fill="#e02424" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
          <rect x="20" y="13" width="4" height="13" rx="2" fill="#fff"/><circle cx="22" cy="31" r="2.5" fill="#fff"/></svg>
        <div>
          <div class="lbl">지금 서울 위험 높음 구역</div>
          <div class="big" id="live-n">…<small> 곳</small></div>
          <span class="badge" id="live-pct">계산 중</span>
          <div class="sub" id="live-meta">500m 격자 2,118칸 기준</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let seed = 7;
const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

// 지도 카드 안 길 모양
(function () {
  let st = "";
  for (let i = 0; i < 26; i++) {
    const y = rnd() * 400, x = rnd() * 700;
    st += `<path d="M0 ${y} Q350 ${y + (rnd() - .5) * 80} 700 ${y + (rnd() - .5) * 60}" stroke-width="${rnd() < .2 ? 2 : .8}"/>`;
    st += `<path d="M${x} 0 Q${x + (rnd() - .5) * 80} 200 ${x + (rnd() - .5) * 60} 400" stroke-width="${rnd() < .2 ? 2 : .8}"/>`;
  }
  document.getElementById("streets").innerHTML = st;
})();

// ── 배경 사진을 화면에 꽉 차게 (cover) + 차가 잘 보이는 위치로 ──
const IW = 1303, IH = 1207;                 // 사진 원본 크기
const scene = document.getElementById("scene");
let S = 1;
function place() {
  const hero = document.querySelector(".hero"), W = hero.clientWidth, H = hero.clientHeight, phone = W < 760;
  const S0 = Math.max(W / IW, H / IH), w0 = IW * S0, h0 = IH * S0;
  // 잘릴 때 어느 쪽을 남길지. 휴대폰은 차(사진 x 922 지점)를 화면 가운데쯤, 위아래는 꽉 차게
  const left0 = phone ? Math.min(0, Math.max(W - w0, W * 0.55 - 922 * S0)) : (W - w0) * 0.5;
  const top0 = phone ? (H - h0) * 0.5 : (H - h0) * 0.53;
  // 차 크기 줄이기: 차 위치(사진 922, 800 지점)는 그대로 두고 사진 전체를 ZOOM 배로 축소
  const ZOOM = phone ? 0.70 : 0.66, CX = 922, CY = 800;
  S = S0 * ZOOM;
  const w = IW * S, h = IH * S;
  const left = left0 + CX * S0 - CX * S, top = top0 + CY * S0 - CY * S;
  const box = { width: w + "px", height: h + "px", left: left + "px", top: top + "px" };
  Object.assign(scene.style, box); Object.assign(document.getElementById("front").style, box);
  streaks.resize(w, h); oncoming.resize(w, h);
}

// ── 속도감: 소실점에서 바깥으로 빠르게 지나가는 빛줄기 ──
const streaks = (function () {
  const cv = document.getElementById("streaks"), ctx = cv.getContext("2d");
  const VP = [455, 752];                   // 도로 소실점 (사진 원본 좌표)
  let w = 0, h = 0, k = 1, last = performance.now();
  const parts = [];
  function spawn(p, fresh) {
    // 도로 쪽(아래 방향)과 양옆 가드레일·가로등 높이로만
    const side = rnd();
    p.a = side < .7 ? Math.PI * (0.52 + rnd() * 0.42)       // 아래쪽 (노면)
                    : (rnd() < .5 ? Math.PI * (0.985 + rnd() * .03) : Math.PI * (0.005 + rnd() * .05));  // 왼쪽·오른쪽 가드레일
    p.r = fresh ? 20 + rnd() * 600 : 20 + rnd() * 60;
    p.v = 0.9 + rnd() * 0.9;
    p.warm = rnd() < .55;
    p.wid = .6 + rnd() * 1.6;
  }
  for (let i = 0; i < 70; i++) { const p = {}; spawn(p, true); parts.push(p); }
  function resize(nw, nh) {
    const dpr = Math.min(2, devicePixelRatio || 1);
    w = nw; h = nh; k = nw / IW;
    cv.width = nw * dpr; cv.height = nh * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = "lighter";
    for (const p of parts) {
      p.r *= 1 + p.v * 1.6 * dt;                         // 멀리서 가까이 올수록 빨라짐
      const len = p.r * 0.22;
      const x1 = VP[0] + Math.cos(p.a) * p.r, y1 = VP[1] + Math.sin(p.a) * p.r;
      const x0 = VP[0] + Math.cos(p.a) * (p.r - len), y0 = VP[1] + Math.sin(p.a) * (p.r - len);
      if (x1 < -50 || x1 > IW + 50 || y1 > IH + 50 || y1 < 0) { spawn(p, false); continue; }
      const al = Math.min(1, p.r / 260) * 0.55;
      const g = ctx.createLinearGradient(x0 * k, y0 * k, x1 * k, y1 * k);
      const c = p.warm ? "255,170,90" : "230,235,255";
      g.addColorStop(0, `rgba(${c},0)`); g.addColorStop(1, `rgba(${c},${al})`);
      ctx.strokeStyle = g; ctx.lineWidth = p.wid * k * (0.6 + p.r / 500);
      ctx.beginPath(); ctx.moveTo(x0 * k, y0 * k); ctx.lineTo(x1 * k, y1 * k); ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(frame);
  }
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(frame);
  return { resize };
})();
// ── 반대편 차로: 헤드라이트를 켠 차가 멀리서 다가와 왼쪽으로 스쳐 지나감 ──
// 사진의 도로 소실점(455, 752)에서 노란 중앙선 왼쪽 차로를 따라 원근법으로 커지며 이동
const oncoming = (function () {
  const cv = document.getElementById("oncoming"), ctx = cv.getContext("2d");
  const VP = [455, 752], LANES = [-4.4, -5.9];   // 차로 위치 (가로 기울기: 소실점에서 1px 내려올 때 왼쪽으로 몇 px)
  const CAR = 1.45;                               // 차 너비 = CAR × (소실점에서 내려온 거리)
  let w = 0, h = 0, k = 1, last = performance.now(), wait = 0.6;
  const cars = [];
  function resize(nw, nh) {
    const dpr = Math.min(2, devicePixelRatio || 1);
    w = nw; h = nh; k = nw / IW;
    cv.width = nw * dpr; cv.height = nh * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function glow(x, y, r, color, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${color},${a})`); g.addColorStop(.25, `rgba(${color},${a * .45})`); g.addColorStop(1, `rgba(${color},0)`);
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function draw(c) {
    const t = 120 / c.z * 10;                          // 소실점에서 내려온 거리 (가까울수록 빨리 커짐)
    const x = (VP[0] + c.lane * t) * k, y = (VP[1] + t) * k;
    const cw = CAR * t * k, ch = cw * 0.72, a = Math.min(1, t / 14);
    if (x + cw < -40) return false;                   // 화면 왼쪽 밖으로 나감
    // 차체 (어두운 앞모습)
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = a * .92;
    ctx.fillStyle = "#07080c"; ctx.beginPath();
    ctx.moveTo(x - cw * .5, y); ctx.lineTo(x - cw * .5, y - ch * .5); ctx.quadraticCurveTo(x - cw * .44, y - ch * .62, x - cw * .3, y - ch * .66);
    ctx.lineTo(x - cw * .22, y - ch); ctx.lineTo(x + cw * .22, y - ch); ctx.lineTo(x + cw * .3, y - ch * .66);
    ctx.quadraticCurveTo(x + cw * .44, y - ch * .62, x + cw * .5, y - ch * .5); ctx.lineTo(x + cw * .5, y); ctx.fill();
    ctx.fillStyle = "rgba(120,140,180,.18)";           // 앞유리에 비친 하늘
    ctx.beginPath(); ctx.moveTo(x - cw * .27, y - ch * .68); ctx.lineTo(x - cw * .2, y - ch * .95); ctx.lineTo(x + cw * .2, y - ch * .95); ctx.lineTo(x + cw * .27, y - ch * .68); ctx.fill();
    // 헤드라이트 + 번진 빛 + 젖은 노면 반사
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = a;
    for (const side of [-1, 1]) {
      const hx = x + side * cw * .36, hy = y - ch * .42;
      const rg = ctx.createLinearGradient(0, y, 0, y + t * 1.3 * k);
      rg.addColorStop(0, "rgba(255,240,215,.6)"); rg.addColorStop(1, "rgba(255,240,215,0)");
      ctx.fillStyle = rg; ctx.fillRect(hx - cw * .1, y, cw * .2, t * 1.3 * k);
      glow(hx, hy, Math.max(30, cw * 2.2), "255,225,185", .16);   // 넓게 퍼지는 빛
      glow(hx, hy, Math.max(12, cw * .9), "255,236,205", .6);
      glow(hx, hy, Math.max(3, cw * .12), "255,255,255", 1);
    }
    // 렌즈에 생기는 가로 빛줄기
    const fl = ctx.createLinearGradient(x - cw * 1.6, 0, x + cw * 1.6, 0);
    fl.addColorStop(0, "rgba(255,240,220,0)"); fl.addColorStop(.5, `rgba(255,240,220,${.35 * a})`); fl.addColorStop(1, "rgba(255,240,220,0)");
    ctx.fillStyle = fl; ctx.fillRect(x - cw * 1.6, y - ch * .42 - Math.max(.6, cw * .012), cw * 3.2, Math.max(1.2, cw * .024));
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    return true;
  }
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    ctx.clearRect(0, 0, w, h);
    wait -= dt;
    if (wait <= 0) {                                  // 다음 차 등장 (가끔 두 대가 나란히)
      cars.push({ z: 120, lane: LANES[0], v: 38 + rnd() * 14 });
      if (rnd() < .35) cars.push({ z: 128 + rnd() * 10, lane: LANES[1], v: 34 + rnd() * 10 });
      wait = 0.8 + rnd() * 1.6;
    }
    for (let i = cars.length - 1; i >= 0; i--) {
      const c = cars[i];
      c.z -= c.v * dt;
      if (c.z < 1 || !draw(c)) cars.splice(i, 1);
    }
    requestAnimationFrame(frame);
  }
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(frame);
  return { resize };
})();
place(); addEventListener("resize", place);

// ── 실제 모델 결과: 지금 서울 위험 높음 칸 수 ──────────────
fetch("/api/risk").then(r => r.json()).then(d => {
  const n = d["개수"]["높음"] || 0, all = Object.values(d["개수"]).reduce((a, b) => a + b, 0);
  document.getElementById("live-n").innerHTML = n.toLocaleString() + "<small> 곳</small>";
  document.getElementById("live-pct").textContent = "전체의 " + Math.round(n / all * 100) + "%";
  document.getElementById("live-meta").textContent = d["시각"] + " · " + "날씨 " + d["날씨_출처"];
}).catch(() => { document.getElementById("live-pct").textContent = "불러오기 실패"; });
</script>
</body>
